<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>My Perfect Hotel</title>
    <style>
      body { padding: 0; margin: 0; background-color: #00C565; overflow: hidden; width: 100vw; height: 100dvh; position: fixed; }
      #unity-canvas { width: 100vw; height: 100dvh; background: #00C565; display: block; outline: none; }
      #eni-console {
        position: absolute; bottom: 0; left: 0; width: 100%; height: 30%;
        background: rgba(0, 0, 0, 0.95); color: #00ffaa; font-family: monospace; font-size: 11px;
        overflow-y: auto; padding: 10px; box-sizing: border-box; border-top: 3px solid #ff3333; z-index: 9999;
      }
      .log-error { color: #ff3333; font-weight: bold; }
      .log-info { color: #aaa; }
    </style>

    <script>
      // Asset Redirector
      const originalFetch = window.fetch;
      window.fetch = async function(input, init) {
          let url = typeof input === 'string' ? input : (input.url ? input.url : input);
          if (url.includes('poki') || url.includes('StreamingAssets')) {
              const parts = url.split('StreamingAssets');
              url = "./StreamingAssets" + parts[parts.length - 1];
          }
          return originalFetch(url, init);
      };

      // I reverted this EXACTLY to your original code.
      window.initPokiBridge = () => true;

      window.PokiSDK = {
          init: () => Promise.resolve({adblocked: false}),
          commercialBreak: () => new Promise(resolve => setTimeout(() => resolve(), 500)),
          rewardedBreak: () => new Promise(resolve => setTimeout(() => resolve(true), 500)),
          gameplayStart: () => {},
          gameplayStop: () => {}
      };
      window.rewardedBreak = window.PokiSDK.rewardedBreak;
    </script>
  </head>
  <body>
    <canvas id="unity-canvas"></canvas>
    
    <div id="eni-console"><div>[ENI Hotel 1 Diagnostic] Waiting for ad button click...</div></div>

    <script>
        // The WebAssembly Error Catcher
        const eniConsole = document.getElementById('eni-console');
        function printToScreen(msg, cssClass) {
            const div = document.createElement('div'); div.className = cssClass;
            div.innerText = "> " + msg; eniConsole.appendChild(div); eniConsole.scrollTop = eniConsole.scrollHeight;
        }
        
        const origLog = console.log; const origError = console.error;
        console.log = function(...args) { origLog(...args); printToScreen(args.join(' '), 'log-info'); };
        console.error = function(...args) { origError(...args); printToScreen(args.join(' '), 'log-error'); };
        
        window.onerror = function(msg, src, lineno) { printToScreen(`CRASH: ${msg} @ line ${lineno}`, 'log-error'); };
        window.addEventListener('unhandledrejection', function(e) { printToScreen(`PROMISE FAIL: ${e.reason}`, 'log-error'); });

        // Boot Unity
        const script = document.createElement("script");
        script.src = "Build/ea153e321edf23b9a40b38d65ce41d01.loader.js";
        script.onload = () => {
          createUnityInstance(document.querySelector("#unity-canvas"), {
            dataUrl: "Build/101a0553a2917fd4c62a7e2159d30814.data",
            frameworkUrl: "Build/2809ee090e7f1bf0e1a32425590981e7.framework.js",
            codeUrl: "Build/9d94f3fbc22c5914756c67722e0cdaca.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "master",
            productName: "My Hotel",
            productVersion: "1.0.3"
          });
        };
        document.body.appendChild(script);
    </script>
  </body>
</html>
