<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Perfect Hotel - Asset Interrogator</title>
    <style>
      body { background-color: #111; color: #00FF00; font-family: monospace; padding: 20px; font-size: 14px; }
      h2 { color: #FFF; }
      .ok { color: #00FF00; }
      .err { color: #FF0000; font-weight: bold; }
    </style>
  </head>
  <body>
    <h2>Asset Interrogator</h2>
    <div id="log">Checking GitHub repository files...<br><br></div>

    <script>
      var logDiv = document.getElementById("log");
      function log(msg) { logDiv.innerHTML += msg + "<br>"; }

      var filesToTest = [
        "Build/101a0553a2917fd4c62a7e2159d30814.data",
        "Build/2809ee090e7f1bf0e1a32425590981e7.framework.js",
        "Build/9d94f3fbc22c5914756c67722e0cdaca.wasm",
        "Build/ea153e321edf23b9a40b38d65ce41d01.loader.js"
      ];

      filesToTest.forEach(function(file) {
          log("Requesting: " + file + " ...");
          fetch(file, { method: 'HEAD' })
            .then(function(response) {
                if (response.ok) {
                    var size = response.headers.get('content-length');
                    var type = response.headers.get('content-type');
                    log(" -> <span class='ok'>FOUND (200 OK)</span> | Size: " + (size ? size + " bytes" : "Unknown") + " | Type: " + type);
                } else {
                    log(" -> <span class='err'>MISSING (" + response.status + " " + response.statusText + ")</span>");
                }
            })
            .catch(function(err) {
                log(" -> <span class='err'>NETWORK ERROR: " + err.message + "</span>");
            });
      });
    </script>
  </body>
</html>
