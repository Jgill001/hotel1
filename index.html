      /* The Diagnostic Panel UI */
      #diag-panel {

        background: rgba(10, 10, 10, 0.9); color: #fff; z-index: 99999;

      #diag-header {

      .diag-ok { color: #00C565; margin-bottom: 4px; opacity: 0.7; }
      
      #toggle-btn {
        background: #444; color: white; border: none; cursor: pointer; padding: 5px 10px; border-radius: 3px;
      }

      /* The floating Show Button */
      #show-btn {
        position: absolute; top: 10px; left: 10px; z-index: 99998;
        background: rgba(0,0,0,0.6); color: #00FF00; border: 1px solid #00FF00;
        padding: 8px 12px; border-radius: 4px; font-family: monospace; cursor: pointer;
        display: none; /* Hidden by default while panel is open */
      }
