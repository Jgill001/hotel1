    <script>
      (function() {
          // 1. The exact Monkey Mart 'eval' interceptor
          const originalEval = window.eval;
          window.eval = function(code) {
              if (typeof code === 'string' && code.includes('window.location')) {
                  code = code.replace("window.location[_0xcdc9('0x1')] = _0x3296f7;", 'return;');
                  code = code.replace("window.location[_0xcdc9('0x1')]=_0x3296f7;", 'return;');
              }
              return originalEval(code);
          };

          // 2. Unity-Specific Armor (Kills direct navigation commands)
          window.location.replace = function(url) { console.log("Blocked Unity sitelock replace: " + url); };
          window.location.assign = function(url) { console.log("Blocked Unity sitelock assign: " + url); };
      })();
    </script>

    <script src="poki-sdk.js"></script>

    <script src="Build/ea153e321edf23b9a40b38d65ce41d01.loader.js"></script>

      // Hardwiring the engine directly to our stolen data files
      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/101a0553a2917fd4c62a7e2159d30814.data",
        frameworkUrl: buildUrl + "/2809ee090e7f1bf0e1a32425590981e7.framework.js",
        codeUrl: buildUrl + "/9d94f3fbc22c5914756c67722e0cdaca.wasm",
        streamingAssetsUrl: "StreamingAssets",

        productVersion: "1.0",
      };

      var canvas = document.querySelector("#unity-canvas");

      // Initialize our fake SDK, then boot the game
      PokiSDK.init().then(function() {
          createUnityInstance(canvas, config).then(function(unityInstance) {
              PokiSDK.gameLoadingFinished();
              console.log("Hotel Engine Initialized Successfully.");
          }).catch(function(message) {
              console.error("Unity crash: " + message);
          });
      }).catch(function() {
          // If SDK fails, boot the game anyway
          createUnityInstance(canvas, config);
      });
    </script>
