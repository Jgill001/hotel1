<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hotel Pinpoint Debugger</title>
    <link rel="icon" href="data:,">
    <style>
      /* Force the page to stay exactly the size of the window */
      html, body { 
        padding: 0; margin: 0; 
        width: 100%; height: 100%; 
        background-color: #00C565; 
        overflow: hidden; 
        position: fixed; /* Prevents accidental scrolling/zooming */
      }

      /* The Game Canvas */
      #unity-canvas { 
        width: 100%; height: 100%; 
        display: block; 
        outline: none;
      }

      #debug-panel {
        position: absolute; top: 10px; left: 10px; z-index: 99999;
        background: rgba(0, 0, 0, 0.85); color: #00FF00; padding: 10px;
        border: 2px solid #00FF00; border-radius: 5px; width: 280px;
        font-family: monospace; font-size: 11px;
      }
      .btn { width: 100%; margin: 5px 0; padding: 10px; cursor: pointer; background: #222; color: #00FF00; border: 1px solid #00FF00; font-weight: bold; }
      #net-log { background: #000; padding: 5px; height: 120px; overflow-y: auto; margin-top: 10px; border: 1px solid #333; }
      .err { color: #ff4444; }
    </style>

    <script>
      function logNet(msg, type='ok') {
          const nl = document.getElementById('net-log');
          if (nl) {
              const div = document.createElement('div');
              div.className = type;
              div.innerText = `[${new Date().toLocaleTimeString().split(' ')[0]}] ${msg}`;
              nl.appendChild(div);
              nl.scrollTop = nl.scrollHeight;
          }
      }

      // 1. FIX THE LOAD ERROR
      window.initPokiBridge = () => { logNet("✅ Bridge Init"); return true; };

      window.PokiSDK = {
          init: () => Promise.resolve({adblocked: false}),
          commercialBreak: () => Promise.resolve(),
          rewardedBreak: () => {
              logNet("💎 AD BUTTON CLICKED!");
              return new Promise(resolve => { window._adResolve = resolve; });
          },
          gameplayStart: () => {}, gameplayStop: () => {}, gameInteractive: () => {}
      };
      window.rewardedBreak = window.PokiSDK.rewardedBreak;

      // 2. REDIRECTOR
      const originalFetch = window.fetch;
      window.fetch = async function(input, init) {
          let url = typeof input === 'string' ? input : (input.url ? input.url : input);
          if (url.includes('poki') || url.includes('StreamingAssets')) {
              const parts = url.split('StreamingAssets');
              url = "./StreamingAssets" + parts[parts.length - 1];
          }
          return originalFetch(url, init);
      };

      // 3. ACTIONS
      function triggerSuccess() {
          if (window._adResolve) {
              logNet("📤 Sending 'TRUE'...");
              window._adResolve(true);
              window._adResolve = null;
          }
      }
    </script>
  </head>
  <body>

    <div id="debug-panel">
      <b>TERMINAL v4</b>
      <div id="net-log">Waiting...</div>
      <button class="btn" onclick="triggerSuccess()" style="border-color:#ffcc00; color:#ffcc00;">🔓 FORCE REWARD SUCCESS</button>
    </div>

    <canvas id="unity-canvas"></canvas>

    <script src="Build/ea153e321edf23b9a40b38d65ce41d01.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/101a0553a2917fd4c62a7e2159d30814.data",
        frameworkUrl: "Build/2809ee090e7f1bf0e1a32425590981e7.framework.js",
        codeUrl: "Build/9d94f3fbc22c5914756c67722e0cdaca.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "master",
        productName: "My Hotel",
        productVersion: "1.0.3"
      }).then((instance) => {
          window.uInst = instance;
          logNet("🟢 ENGINE READY.");
      });
    </script>
  </body>
</html>
