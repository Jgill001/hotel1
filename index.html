<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>Hotel Pinpoint Debugger</title>
    <link rel="icon" href="data:,">
    <style>
      body { padding: 0; margin: 0; background-color: #00C565; overflow: hidden; font-family: monospace; }
      #unity-canvas { width: 100vw; height: 100vh; display: block; }
      #debug-panel {
        position: absolute; top: 10px; left: 10px; z-index: 99999;
        background: rgba(0, 0, 0, 0.9); color: #00FF00; padding: 10px;
        border: 2px solid #00FF00; border-radius: 5px; width: 320px;
      }
      .btn { width: 100%; margin: 5px 0; padding: 8px; cursor: pointer; background: #222; color: #00FF00; border: 1px solid #00FF00; font-weight: bold; }
      #net-log { background: #111; padding: 5px; height: 180px; overflow-y: auto; margin-top: 10px; border: 1px solid #333; font-size: 10px; }
      .err { color: #ff4444; }
    </style>

    <script>
      function logNet(msg, type='ok') {
          const nl = document.getElementById('net-log');
          if (nl) {
              const div = document.createElement('div');
              div.className = type;
              div.innerText = `[${new Date().toLocaleTimeString().split(' ')[0]}] ${msg}`;
              nl.appendChild(div);
              nl.scrollTop = nl.scrollHeight;
          }
      }

      // --- 1. FIX THE LOAD ERROR (The Bridge) ---
      window.initPokiBridge = function() {
          logNet("✅ initPokiBridge called by Engine");
          return true; 
      };

      window.PokiSDK = {
          init: () => { logNet("SDK: init()"); return Promise.resolve({adblocked: false}); },
          commercialBreak: () => { logNet("SDK: commercialBreak()"); return Promise.resolve(); },
          rewardedBreak: () => {
              logNet("💎 AD BUTTON CLICKED!", "ok");
              return new Promise(resolve => {
                  window._adResolve = resolve;
                  logNet("⚠️ Waiting for manual 'Force Success'...");
              });
          },
          gameplayStart: () => logNet("SDK: gameplayStart()"),
          gameplayStop: () => logNet("SDK: gameplayStop()"),
          gameInteractive: () => logNet("SDK: gameInteractive()")
      };

      // Ensure legacy calls work
      window.rewardedBreak = window.PokiSDK.rewardedBreak;
      window.commercialBreak = window.PokiSDK.commercialBreak;

      // --- 2. TRAFFIC REDIRECTOR ---
      const originalFetch = window.fetch;
      window.fetch = async function(input, init) {
          let url = typeof input === 'string' ? input : (input.url ? input.url : input);
          let redirectUrl = url;
          if (url.includes('poki') || url.includes('StreamingAssets')) {
              const parts = url.split('StreamingAssets');
              redirectUrl = "./StreamingAssets" + parts[parts.length - 1];
          }
          try {
              const res = await originalFetch(redirectUrl, init);
              return res;
          } catch(e) {
              logNet(`Net Error: ${redirectUrl.split('/').pop()}`, 'err');
              throw e;
          }
      };

      // --- 3. PINPOINT ACTIONS ---
      function triggerSuccess() {
          if (window._adResolve) {
              logNet("📤 Sending 'TRUE' to Unity...");
              window._adResolve(true);
              window._adResolve = null;
          } else {
              logNet("❌ No ad request active.", "err");
          }
      }

      function testInternalMessage() {
          if (!window.uInst) return logNet("❌ Engine not ready", "err");
          logNet("📡 Testing C# Bridge...");
          // This tries to talk to the engine directly
          try {
              window.uInst.SendMessage("AdsManager", "OnRewardedFinished", "true");
              logNet("Sent OnRewardedFinished to AdsManager");
          } catch(e) { logNet("Bridge test failed", "err"); }
      }
    </script>
  </head>
  <body>

    <div id="debug-panel">
      <b style="color:white">TERMINAL v3</b>
      <div id="net-log">Waiting for engine...</div>
      
      <button class="btn" onclick="testInternalMessage()">📡 Test C# Bridge</button>
      <button class="btn" onclick="triggerSuccess()" style="border-color:#ffcc00; color:#ffcc00;">🔓 FORCE REWARD SUCCESS</button>
      
      <p style="font-size: 9px; color: #888;">If game loads, ad logic is now bugged for pinpointing.</p>
    </div>

    <canvas id="unity-canvas"></canvas>

    <script src="Build/ea153e321edf23b9a40b38d65ce41d01.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/101a0553a2917fd4c62a7e2159d30814.data",
        frameworkUrl: "Build/2809ee090e7f1bf0e1a32425590981e7.framework.js",
        codeUrl: "Build/9d94f3fbc22c5914756c67722e0cdaca.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "master",
        productName: "My Hotel",
        productVersion: "1.0.3"
      }).then((instance) => {
          window.uInst = instance;
          logNet("🟢 ENGINE READY.");
      }).catch(err => logNet("❌ LOAD ERROR: " + err, "err"));
    </script>
  </body>
</html>
