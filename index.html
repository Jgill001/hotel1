<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Perfect Hotel - Private Server</title>
    <style>
      body { padding: 0; margin: 0; background-color: #00C565; overflow: hidden; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
      #unity-canvas { width: 100%; height: 100%; background: #00C565; }
      #debug-console { position: absolute; top: 10px; left: 10px; color: #00FF00; background: rgba(0,0,0,0.85); padding: 10px; z-index: 9999; font-family: monospace; font-size: 11px; pointer-events: none; max-width: 90vw; word-wrap: break-word; }
    </style>
    
    <script>
      // 1. Crash Catchers
      window.onerror = function(m) { document.getElementById("debug-console").innerHTML += "<br><span style='color:red'>ERR: " + m + "</span>"; };
      window.onunhandledrejection = function(e) { document.getElementById("debug-console").innerHTML += "<br><span style='color:orange'>PROMISE: " + (e.reason||"Unknown") + "</span>"; };

      // 2. The Network Sniffer (Wiretapping background downloads)
      const originalFetch = window.fetch;
      window.fetch = async function(...args) {
          var url = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url ? args[0].url : 'unknown');
          // Ignore the core files we already know about to avoid spam
          if(!url.includes('.data') && !url.includes('.wasm') && !url.includes('.js')) { 
              document.getElementById("debug-console").innerHTML += "<br><span style='color:lightblue'>FETCHING: " + url.substring(url.lastIndexOf('/')+1) + "</span>";
          }
          return originalFetch.apply(this, args);
      };

      const originalXHR = window.XMLHttpRequest.prototype.open;
      window.XMLHttpRequest.prototype.open = function(method, url) {
          if(typeof url === 'string' && !url.includes('.data') && !url.includes('.wasm') && !url.includes('.js')) {
              document.getElementById("debug-console").innerHTML += "<br><span style='color:lightblue'>XHR REQ: " + url.substring(url.lastIndexOf('/')+1) + "</span>";
          }
          return originalXHR.apply(this, arguments);
      };

      // 3. Poki Mock (Kept active just in case)
      window.initPokiBridge = function() { return true; };
      window.PokiSDK = new Proxy({}, { get: function(t, p) { if (p === 'then') return undefined; return function() { return Promise.resolve(true); }; } });
    </script>
  </head>
  <body>
    <div id="debug-console">Booting Network Sniffer...</div>
    <canvas id="unity-canvas"></canvas>
    <script src="Build/ea153e321edf23b9a40b38d65ce41d01.loader.js"></script>
    
    <script>
      var debug = document.getElementById("debug-console");
      function log(msg) { debug.innerHTML += "<br>" + msg; }

      var config = {
        dataUrl: "Build/101a0553a2917fd4c62a7e2159d30814.data",
        frameworkUrl: "Build/2809ee090e7f1bf0e1a32425590981e7.framework.js",
        codeUrl: "Build/9d94f3fbc22c5914756c67722e0cdaca.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "master",
        productName: "My Hotel",
        productVersion: "1.0.3",
        cacheControl: function (url) { return "no-store"; }, 
      };

      createUnityInstance(document.querySelector("#unity-canvas"), config, function(p) {
          if (p === 1 && !window.loggedData) { log("Core chunks loaded."); window.loggedData = true; }
      }).then(function(u) {
          log("<span style='color:cyan'>WASM Instance Loaded!</span>");
      });
    </script>
  </body>
</html>
