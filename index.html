<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Perfect Hotel - Fixed UI & Ads</title>
    <style>
      /* The dvh fix ensures the bottom of the game isn't cut off by mobile browser bars */
      body { 
        padding: 0; margin: 0; 
        background-color: #00C565; 
        overflow: hidden; 
        width: 100vw; 
        height: 100dvh; 
        display: flex;
        justify-content: center;
        align-items: center;
      }
      
      #unity-canvas { 
        width: 100%; 
        height: 100%; 
        background: #00C565;
        /* Ensures the canvas respects mobile aspect ratios */
        max-height: 100dvh;
        object-fit: contain;
      }
    </style>
    <script>
      (function() {
          const originalFetch = window.fetch;
          window.fetch = function(input, init) {
              let url = typeof input === 'string' ? input : (input.url ? input.url : input);
              if (typeof url === 'string' && (url.includes('poki') || url.includes('StreamingAssets'))) {
                  const parts = url.split('StreamingAssets');
                  return originalFetch("./StreamingAssets" + parts[parts.length - 1], init);
              }
              return originalFetch(input, init);
          };
          
          Object.defineProperty(document, 'URL', { get: () => "https://poki.com/en/g/my-perfect-hotel" });
          Object.defineProperty(document, 'domain', { get: () => "poki.com" });
      })();

      // --- ADVANCED AD BYPASS LOGIC ---
      window.rewardedBreak = function() {
          console.log("Rewarding player instantly...");
          // We trigger gameplayStop then Start to "unstick" the Unity engine
          if (window.PokiSDK && window.PokiSDK.gameplayStop) window.PokiSDK.gameplayStop();
          
          return new Promise((resolve) => {
              setTimeout(() => { 
                  if (window.PokiSDK && window.PokiSDK.gameplayStart) window.PokiSDK.gameplayStart();
                  resolve(true); 
              }, 1000); // 1 second delay is the sweet spot for mobile stability
          });
      };

      window.commercialBreak = function() {
          return new Promise((resolve) => {
              setTimeout(() => { resolve(false); }, 500);
          });
      };

      window.initPokiBridge = function() { return true; };
      window.PokiSDK = {
          init: function() { return Promise.resolve(); },
          commercialBreak: window.commercialBreak,
          rewardedBreak: window.rewardedBreak,
          gameplayStart: function() { console.log("SDK: Gameplay Resumed"); },
          gameplayStop: function() { console.log("SDK: Gameplay Paused"); },
          gameLoadingFinished: function() {},
          gameInteractive: function() {},
          setDebug: function() {}
      };
    </script>
  </head>
  <body>
    <canvas id="unity-canvas"></canvas>
    <script src="Build/ea153e321edf23b9a40b38d65ce41d01.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/101a0553a2917fd4c62a7e2159d30814.data",
        frameworkUrl: "Build/2809ee090e7f1bf0e1a32425590981e7.framework.js",
        codeUrl: "Build/9d94f3fbc22c5914756c67722e0cdaca.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "master",
        productName: "My Hotel",
        productVersion: "1.0.3"
      });
    </script>
  </body>
</html>
