    <script>
      (function() {
          window.missingFiles = new Set();
          
          // 1. Silent Local Traffic Diverter & File Tracker
          const originalFetch = window.fetch;
          window.fetch = function(input, init) {
              let url = typeof input === 'string' ? input : (input.url ? input.url : input);
              if (typeof url === 'string' && (url.includes('poki') || url.includes('StreamingAssets'))) {
                  const parts = url.split('StreamingAssets');
                  const relativePath = parts[parts.length - 1];
                  const localPath = "./StreamingAssets" + relativePath;
                  
                  // Silently record any requested bundle, hash, or json
                  if (relativePath.includes('.bundle') || relativePath.includes('.hash') || relativePath.includes('.json') || relativePath.includes('.prefab')) {
                      // Format perfectly for our Colab Python list
                      const colabPath = "StreamingAssets" + relativePath;
                      window.missingFiles.add('"' + colabPath + '"');
                  }
                  
                  return originalFetch(localPath, init);
              }
              return originalFetch(input, init);
          };

          const oxhr = window.XMLHttpRequest.prototype.open;
          window.XMLHttpRequest.prototype.open = function(m, url) {
              if (typeof url === 'string' && (url.includes('poki') || url.includes('StreamingAssets'))) {
                  const parts = url.split('StreamingAssets');
                  url = "./StreamingAssets" + parts[parts.length - 1];
              }
              return oxhr.apply(this, arguments);
          };

          // 2. Sitelock Spoofing
          Object.defineProperty(document, 'URL', { get: () => "https://poki.com/en/g/my-perfect-hotel" });
          Object.defineProperty(document, 'domain', { get: () => "poki.com" });
      })();

      // 3. Bulletproof Poki SDK Mock
      window.initPokiBridge = function() { return true; };
      window.PokiSDK = {
          init: function() { return Promise.resolve(); },
          setDebug: function() {},
          gameLoadingStart: function() {},
          gameLoadingProgress: function() {},
          gameLoadingFinished: function() {},
          gameInteractive: function() {},
          commercialBreak: function() { return Promise.resolve(false); }, 
          rewardedBreak: function() { return Promise.resolve(true); },    
          gameplayStart: function() {},
          gameplayStop: function() {}
      };
      
      // The Copy Function for Mobile
      window.exportLog = function() {
          const textToCopy = Array.from(window.missingFiles).join(',\n');
          
          // Mobile-safe copy hack
          const textArea = document.createElement("textarea");
          textArea.value = textToCopy;
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
          
          const btn = document.getElementById("stealth-btn");
          btn.innerText = "LOG COPIED!";
          btn.style.background = "#00C565";
          btn.style.color = "#000";
          
          setTimeout(() => {
              btn.innerText = "💾 COPY LOG";
              btn.style.background = "rgba(0, 0, 0, 0.5)";
              btn.style.color = "#00FF00";
          }, 3000);
      };
    </script>
