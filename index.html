<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>Hotel Debugger - Pinpoint Edition</title>
    <link rel="icon" href="data:,">
    <style>
      body { padding: 0; margin: 0; background-color: #00C565; overflow: hidden; font-family: monospace; }
      #unity-canvas { width: 100vw; height: 100vh; display: block; }
      
      #debug-panel {
        position: absolute; top: 10px; left: 10px; z-index: 99999;
        background: rgba(0, 0, 0, 0.9); color: #00FF00; padding: 10px;
        border: 2px solid #00FF00; border-radius: 5px; width: 320px;
        max-height: 90vh; overflow-y: auto; font-size: 11px;
      }
      .btn {
        width: 100%; margin: 5px 0; padding: 8px; cursor: pointer;
        background: #222; color: #00FF00; border: 1px solid #00FF00; font-weight: bold;
      }
      .btn:hover { background: #00FF00; color: #000; }
      .err { color: #ff4444; }
      .ok { color: #00ff00; opacity: 0.6; }
      #net-log { background: #111; padding: 5px; height: 150px; overflow-y: auto; margin-top: 10px; border: 1px solid #333; }
    </style>

    <script>
      // --- 1. THE REDIRECTOR & NETWORK LOGGER ---
      function logNet(msg, type='ok') {
          const nl = document.getElementById('net-log');
          if (nl) {
              const div = document.createElement('div');
              div.className = type;
              div.innerText = msg;
              nl.appendChild(div);
              nl.scrollTop = nl.scrollHeight;
          }
          console.log(msg);
      }

      const originalFetch = window.fetch;
      window.fetch = async function(input, init) {
          let url = typeof input === 'string' ? input : (input.url ? input.url : input);
          let redirectUrl = url;

          // Catch anything Poki-related or Unity-internal
          if (url.includes('poki') || url.includes('StreamingAssets') || url.includes('Build/')) {
              if (url.includes('StreamingAssets')) {
                  const parts = url.split('StreamingAssets');
                  redirectUrl = "./StreamingAssets" + parts[parts.length - 1];
              } else if (url.includes('Build/')) {
                  const parts = url.split('Build/');
                  redirectUrl = "./Build/" + parts[parts.length - 1];
              }
          }

          logNet(`REQ: ${redirectUrl.split('/').pop()}`);
          try {
              const res = await originalFetch(redirectUrl, init);
              if (!res.ok) logNet(`FAIL ${res.status}: ${redirectUrl.split('/').pop()}`, 'err');
              return res;
          } catch(e) {
              logNet(`CRASH: ${redirectUrl.split('/').pop()}`, 'err');
              throw e;
          }
      };

      // --- 2. POKI SDK BRIDGE ---
      window.PokiSDK = {
          init: () => Promise.resolve({adblocked: false}),
          commercialBreak: () => Promise.resolve(false),
          rewardedBreak: () => {
              logNet("💎 UNITY ASKED FOR REWARD!", "ok");
              return new Promise(resolve => {
                  window._adResolve = resolve;
              });
          }
      };
      window.rewardedBreak = window.PokiSDK.rewardedBreak;

      // --- 3. DEBUG ACTIONS ---
      function triggerReward() {
          if (window._adResolve) {
              logNet("✅ SENDING SUCCESS SIGNAL...", "ok");
              window._adResolve(true);
              window._adResolve = null;
          } else {
              logNet("⚠️ No ad request waiting.", "err");
          }
      }

      function addMoney() {
          if (window.uInst) {
              logNet("💰 Injecting Cash...");
              window.uInst.SendMessage("GameManager", "AddMoney", 50000);
          }
      }
    </script>
  </head>
  <body>

    <div id="debug-panel">
      <b style="color:white">DIAGNOSTIC TERMINAL</b>
      <div id="net-log">Waiting for engine...</div>
      
      <button class="btn" onclick="addMoney()">💰 +$50k Cash</button>
      <button class="btn" onclick="triggerReward()" style="border-color:#ffcc00; color:#ffcc00;">🔓 FORCE REWARD SUCCESS</button>
      
      <div style="margin-top:10px; font-size:10px; color:#888;">
        If it's green, check the logs above for red text.
      </div>
    </div>

    <canvas id="unity-canvas"></canvas>

    <script src="Build/ea153e321edf23b9a40b38d65ce41d01.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/101a0553a2917fd4c62a7e2159d30814.data",
        frameworkUrl: "Build/2809ee090e7f1bf0e1a32425590981e7.framework.js",
        codeUrl: "Build/9d94f3fbc22c5914756c67722e0cdaca.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "master",
        productName: "My Hotel",
        productVersion: "1.0.3"
      }).then((instance) => {
          window.uInst = instance;
          logNet("🟢 ENGINE LOADED.");
      }).catch(err => {
          logNet("❌ LOAD ERROR: " + err, "err");
      });
    </script>
  </body>
</html>
