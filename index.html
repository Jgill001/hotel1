<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Perfect Hotel - Diagnostic Mode</title>
    <style>
      body { padding: 0; margin: 0; background-color: #00C565; overflow: hidden; width: 100vw; height: 100vh; position: fixed; }
      #unity-canvas { width: 100vw !important; height: 100vh !important; background: #00C565; display: block; }
      
      /* Subtle Log Button */
      #log-btn {
        position: absolute; top: 10px; right: 10px; z-index: 9999;
        background: rgba(0, 0, 0, 0.4); color: #00FF00; border: 1px solid #00FF00;
        padding: 6px 10px; font-family: monospace; font-size: 11px;
        border-radius: 4px; cursor: pointer; backdrop-filter: blur(2px);
      }
    </style>
    <script>
      (function() {
          window.heistLog = [];
          const track = (msg) => { 
              const time = new Date().toLocaleTimeString().split(' ')[0];
              window.heistLog.push(`[${time}] ${msg}`); 
              console.log(msg); 
          };

          // 1. Capture ALL Errors (Hidden or otherwise)
          window.onerror = function(message, source, lineno, colno, error) {
              track(`!!! JS ERROR: ${message} at ${lineno}:${colno}`);
          };

          // 2. Traffic Diverter
          const originalFetch = window.fetch;
          window.fetch = function(input, init) {
              let url = typeof input === 'string' ? input : (input.url ? input.url : input);
              if (typeof url === 'string' && (url.includes('poki') || url.includes('StreamingAssets'))) {
                  const parts = url.split('StreamingAssets');
                  track(`NET: Requesting ${parts[parts.length - 1]}`);
                  return originalFetch("./StreamingAssets" + parts[parts.length - 1], init);
              }
              return originalFetch(input, init);
          };

          // 3. The "Black Box" SDK
          window.PokiSDK = {
              init: function() { 
                  track("SDK: init() called");
                  return Promise.resolve(); 
              },
              commercialBreak: function() {
                  track("SDK: commercialBreak() requested");
                  return new Promise((resolve) => {
                      setTimeout(() => { track("SDK: commercialBreak RESOLVED"); resolve(false); }, 500);
                  });
              },
              rewardedBreak: function() {
                  track("SDK: rewardedBreak() REQUESTED");
                  return new Promise((resolve) => {
                      try {
                          setTimeout(() => {
                              track("SDK: rewardedBreak RESOLVING TRUE (Reward Granted)");
                              resolve(true); 
                          }, 1000); 
                      } catch(e) {
                          track(`SDK: CRITICAL FAIL in rewardedBreak: ${e.message}`);
                      }
                  });
              },
              gameplayStart: function() { track("SDK: gameplayStart() fired"); },
              gameplayStop: function() { track("SDK: gameplayStop() fired"); },
              gameLoadingFinished: function() { track("SDK: loadingFinished()"); },
              gameInteractive: function() { track("SDK: gameInteractive()"); },
              setDebug: function(val) { track(`SDK: setDebug(${val})`); }
          };

          // Global Legacy Hooks
          window.rewardedBreak = window.PokiSDK.rewardedBreak;
          window.commercialBreak = window.PokiSDK.commercialBreak;
          window.initPokiBridge = function() { track("SDK: Bridge Init"); return true; };

          Object.defineProperty(document, 'URL', { get: () => "https://poki.com/en/g/my-perfect-hotel" });
          Object.defineProperty(document, 'domain', { get: () => "poki.com" });
      })();

      function fixCanvasSize() {
          const canvas = document.querySelector("#unity-canvas");
          if (canvas) {
              canvas.style.height = window.innerHeight + "px";
              canvas.style.width = window.innerWidth + "px";
          }
      }
      window.addEventListener('resize', fixCanvasSize);

      window.copyHeistLog = function() {
          const textArea = document.createElement("textarea");
          textArea.value = window.heistLog.join('\n');
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
          document.getElementById("log-btn").innerText = "COPIED!";
          setTimeout(() => { document.getElementById("log-btn").innerText = "💾 LOG"; }, 2000);
      };
    </script>
  </head>
  <body onload="fixCanvasSize()">
    <button id="log-btn" onclick="copyHeistLog()">💾 LOG</button>
    <canvas id="unity-canvas"></canvas>
    <script src="Build/ea153e321edf23b9a40b38d65ce41d01.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/101a0553a2917fd4c62a7e2159d30814.data",
        frameworkUrl: "Build/2809ee090e7f1bf0e1a32425590981e7.framework.js",
        codeUrl: "Build/9d94f3fbc22c5914756c67722e0cdaca.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "master",
        productName: "My Hotel",
        productVersion: "1.0.3"
      }).then(() => {
          setTimeout(fixCanvasSize, 1000);
      });
    </script>
  </body>
</html>
