<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Perfect Hotel - The Proxy Fix</title>
    <style>
      body { padding: 0; margin: 0; background-color: #00C565; overflow: hidden; width: 100vw; height: 100dvh; position: fixed; }
      #unity-canvas { width: 100vw; height: 100dvh; background: #00C565; display: block; outline: none; }
      #log-btn { position: absolute; top: 10px; right: 10px; z-index: 9999; background: rgba(0,0,0,0.6); color: #00FF00; border: 1px solid #00FF00; padding: 8px; border-radius: 4px; font-family: monospace; }
    </style>
    <script>
      (function() {
          window.heistLog = [];
          const track = (msg) => { window.heistLog.push(`${new Date().toLocaleTimeString()} ${msg}`); console.log(msg); };

          window.Pointer_stringify = function(ptr) { return window.UTF8ToString ? window.UTF8ToString(ptr) : "Legacy"; };

          // Traffic Redirector
          const originalFetch = window.fetch;
          window.fetch = function(input, init) {
              let url = typeof input === 'string' ? input : (input.url ? input.url : input);
              if (typeof url === 'string' && (url.includes('poki') || url.includes('StreamingAssets'))) {
                  const parts = url.split('StreamingAssets');
                  return originalFetch("./StreamingAssets" + parts[parts.length - 1], init);
              }
              return originalFetch(input, init);
          };

          // Base SDK Methods
          const baseSDK = {
              init: () => Promise.resolve(),
              commercialBreak: () => {
                  track("SDK: Commercial Ad Skipped");
                  return new Promise(r => setTimeout(() => r(false), 200));
              },
              rewardedBreak: () => {
                  track("SDK: Rewarded Ad Requested");
                  return new Promise((resolve) => {
                      setTimeout(() => {
                          track("SDK: Granting Reward & Forcing Canvas Focus");
                          
                          // 1. Force the browser to refocus the game canvas
                          const canvas = document.getElementById('unity-canvas');
                          if (canvas) {
                              window.focus();
                              canvas.focus();
                          }
                          
                          // 2. Resolve the reward
                          resolve(true); 
                      }, 500); 
                  });
              },
              gameplayStart: () => track("GAME: Playing"),
              gameplayStop: () => track("GAME: Stopped"),
              gameLoadingFinished: () => track("GAME: Loaded"),
              gameInteractive: () => track("GAME: Interactive"),
              setDebug: () => {}
          };

          // --- THE PROXY NET ---
          // This catches ANY undefined function the game tries to call and prevents a crash
          window.PokiSDK = new Proxy(baseSDK, {
              get: function(target, prop) {
                  if (prop in target) {
                      return target[prop]; // Return the normal function if it exists
                  } else {
                      track(`⚠️ SDK MISSING METHOD CAUGHT: ${prop}`);
                      // Return a safe dummy function that won't crash the engine
                      return function() { 
                          track(`   -> Dummy executed for ${prop}`);
                          return Promise.resolve(true); 
                      };
                  }
              }
          });

          window.rewardedBreak = window.PokiSDK.rewardedBreak;
          window.commercialBreak = window.PokiSDK.commercialBreak;
          window.initPokiBridge = () => true;

          Object.defineProperty(document, 'URL', { get: () => "https://poki.com/en/g/my-perfect-hotel" });
          Object.defineProperty(document, 'domain', { get: () => "poki.com" });
      })();

      window.copyHeistLog = function() {
          const textArea = document.createElement("textarea");
          textArea.value = window.heistLog.join('\n');
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
      };
      
      function fixCanvasSize() {
          const canvas = document.querySelector("#unity-canvas");
          if (canvas) { canvas.style.height = window.innerHeight + "px"; canvas.style.width = window.innerWidth + "px"; }
      }
      window.addEventListener('resize', fixCanvasSize);
    </script>
  </head>
  <body onload="fixCanvasSize()">
    <button id="log-btn" onclick="copyHeistLog()">💾 LOG</button>
    <canvas id="unity-canvas" tabindex="1"></canvas>
    <script src="Build/ea153e321edf23b9a40b38d65ce41d01.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/101a0553a2917fd4c62a7e2159d30814.data",
        frameworkUrl: "Build/2809ee090e7f1bf0e1a32425590981e7.framework.js",
        codeUrl: "Build/9d94f3fbc22c5914756c67722e0cdaca.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "master",
        productName: "My Hotel",
        productVersion: "1.0.3"
      }).then((instance) => {
          // Keep a reference to force wake-ups if needed
          window.unityGame = instance;
      });
    </script>
  </body>
</html>
