<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Perfect Hotel - Private Server</title>
    <style>
      body { padding: 0; margin: 0; background-color: #00C565; overflow: hidden; width: 100vw; height: 100vh; }
      #unity-canvas { width: 100%; height: 100%; background: #00C565; }
    </style>
    
    <script>
      // 1. Expanded Domain & Iframe Spoofer
      try {
          Object.defineProperty(document, 'URL', { get: () => "https://poki.com/en/g/my-perfect-hotel" });
          Object.defineProperty(document, 'domain', { get: () => "poki.com" });
          window.top = window.self; 
          window.parent = window.self;
      } catch(e) {}

      // 2. AudioContext Hang Prevention
      window.AudioContext = window.AudioContext || window.webkitAudioContext;
      if (window.AudioContext) {
          const originalAudio = window.AudioContext;
          window.AudioContext = function() {
              const ctx = new originalAudio();
              if (ctx.state === 'suspended') ctx.resume();
              return ctx;
          };
      }

      // 3. Eval Blocker
      const originalEval = window.eval;
      window.eval = function(code) {
          if (typeof code === 'string' && code.includes('window.location')) return;
          return originalEval(code);
      };

      // 4. Poki Mock
      window.initPokiBridge = function() { return true; };
      window.PokiSDK = new Proxy({}, { get: () => function() { return Promise.resolve(true); } });
    </script>
  </head>
  <body>
    <canvas id="unity-canvas"></canvas>
    <script src="Build/ea153e321edf23b9a40b38d65ce41d01.loader.js"></script>
    
    <script>
      // 5. Nuke corrupted save data before booting
      if (window.indexedDB && window.indexedDB.databases) {
          window.indexedDB.databases().then((dbs) => {
              dbs.forEach(db => { window.indexedDB.deleteDatabase(db.name); });
          }).catch(()=>{});
      }

      var config = {
        dataUrl: "Build/101a0553a2917fd4c62a7e2159d30814.data",
        frameworkUrl: "Build/2809ee090e7f1bf0e1a32425590981e7.framework.js",
        codeUrl: "Build/9d94f3fbc22c5914756c67722e0cdaca.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "master",
        productName: "My Hotel",
        productVersion: "1.0.3"
      };

      // Tapping the screen can sometimes un-suspend the audio block
      document.body.addEventListener('click', function() {
          createUnityInstance(document.querySelector("#unity-canvas"), config);
      }, { once: true });
      
      // Auto-boot if no click
      setTimeout(() => {
          if (!document.querySelector("#unity-canvas").dataset.booted) {
              document.querySelector("#unity-canvas").dataset.booted = "true";
              createUnityInstance(document.querySelector("#unity-canvas"), config);
          }
      }, 500);
    </script>
  </body>
</html>
