<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>Hotel Direct Injector</title>
    <style>
      /* ORIGINAL WORKING CSS */
      body { padding: 0; margin: 0; background-color: #00C565; overflow: hidden; width: 100vw; height: 100dvh; position: fixed; }
      #unity-canvas { width: 100vw; height: 100dvh; background: #00C565; display: block; outline: none; }
      
      /* Control Panel */
      #debug-ui {
        position: absolute; top: 0; left: 0; width: 100%;
        display: flex; flex-wrap: wrap; justify-content: center;
        background: rgba(0,0,0,0.8); z-index: 1000; padding: 5px;
      }
      .btn {
        margin: 5px; padding: 10px 15px; cursor: pointer;
        font-weight: bold; border-radius: 5px; border: none; font-family: sans-serif;
      }
      .money { background: #ffcc00; color: black; }
      .ad { background: #007bff; color: white; }
      .unfreeze { background: #dc3545; color: white; }
      #status { position: absolute; bottom: 10px; left: 10px; color: white; font-family: monospace; z-index: 1001; pointer-events: none; }
    </style>

    <script>
      // 1. TRAFFIC REDIRECTOR (Fixes Green Screen)
      const originalFetch = window.fetch;
      window.fetch = async function(input, init) {
          let url = typeof input === 'string' ? input : (input.url ? input.url : input);
          if (url.includes('poki') || url.includes('StreamingAssets')) {
              const parts = url.split('StreamingAssets');
              url = "./StreamingAssets" + parts[parts.length - 1];
          }
          return originalFetch(url, init);
      };

      // 2. THE BRIDGE 
      window.initPokiBridge = () => true;
      window.PokiSDK = {
          init: () => Promise.resolve({adblocked: false}),
          commercialBreak: () => Promise.resolve(),
          rewardedBreak: () => {
              document.getElementById('status').innerText = "Status: Ad Requested";
              return new Promise(resolve => { window._adResolve = resolve; });
          },
          gameplayStart: () => {}, gameplayStop: () => {}
      };
      window.rewardedBreak = window.PokiSDK.rewardedBreak;

      // 3. THE DIRECT INJECTION FUNCTIONS
      function hackMoney() {
          if (!window.uInst) return;
          console.log("💰 Injecting Cash...");
          // Try multiple common object/method names
          const targets = ["GameManager", "CurrencyManager", "InventoryManager", "AdsManager", "Bank"];
          targets.forEach(t => {
              window.uInst.SendMessage(t, "AddMoney", 100000);
              window.uInst.SendMessage(t, "AddCurrency", 100000);
              window.uInst.SendMessage(t, "CheatMoney");
          });
      }

      function forceOpenAd() {
          if (!window.uInst) return;
          console.log("🚀 Forcing Ad UI...");
          const targets = ["AdsManager", "PokiUnitySDK", "AdManager", "UIRoot"];
          targets.forEach(t => {
              window.uInst.SendMessage(t, "ShowRewarded");
              window.uInst.SendMessage(t, "rewardedBreak");
          });
      }

      function forceSuccess() {
          if (window._adResolve) {
              window._adResolve(true);
              window._adResolve = null;
          }
          // Also try to call the C# callback directly
          if (window.uInst) {
              window.uInst.SendMessage("AdsManager", "OnRewardedFinished", "true");
              window.uInst.SendMessage("PokiUnitySDK", "adFinished", "true");
          }
      }
    </script>
  </head>
  <body>

    <div id="debug-ui">
      <button class="btn money" onclick="hackMoney()">💰 +100k CASH</button>
      <button class="btn ad" onclick="forceOpenAd()">📺 OPEN AD UI</button>
      <button class="btn unfreeze" onclick="forceSuccess()">🔓 FORCE REWARD</button>
    </div>

    <div id="status">Status: Engine Loading...</div>

    <canvas id="unity-canvas"></canvas>

    <script src="Build/ea153e321edf23b9a40b38d65ce41d01.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/101a0553a2917fd4c62a7e2159d30814.data",
        frameworkUrl: "Build/2809ee090e7f1bf0e1a32425590981e7.framework.js",
        codeUrl: "Build/9d94f3fbc22c5914756c67722e0cdaca.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "master",
        productName: "My Hotel",
        productVersion: "1.0.3"
      }).then((instance) => {
          window.uInst = instance;
          document.getElementById('status').innerText = "Status: 🟢 READY";
      });
    </script>
  </body>
</html>
