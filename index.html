<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>Hotel Master Debug</title>
    <style>
      /* THE EXACT CSS THAT WORKED FOR YOUR SCALING */
      body { padding: 0; margin: 0; background-color: #00C565; overflow: hidden; width: 100vw; height: 100dvh; position: fixed; }
      #unity-canvas { width: 100vw; height: 100dvh; background: #00C565; display: block; outline: none; }
      
      /* Floating Debug UI - Does not affect game layout */
      #debug-ui {
        position: absolute; top: 10px; left: 10px; z-index: 1000;
        background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px;
        display: flex; flex-direction: column; gap: 5px; width: 150px;
        border: 1px solid #555; pointer-events: auto;
      }
      .btn {
        padding: 8px; cursor: pointer; font-size: 11px; font-weight: bold;
        border: none; border-radius: 4px; text-transform: uppercase;
      }
      .money { background: #ffcc00; color: #000; }
      .ad { background: #007bff; color: #fff; }
      .unfreeze { background: #ff4444; color: #fff; }
      #status-text { color: #00ff00; font-family: monospace; font-size: 10px; margin-bottom: 5px; }
    </style>

    <script>
      // 1. THE REDIRECTOR (Fixes Green Screen)
      const originalFetch = window.fetch;
      window.fetch = async function(input, init) {
          let url = typeof input === 'string' ? input : (input.url ? input.url : input);
          if (url.includes('poki') || url.includes('StreamingAssets')) {
              const parts = url.split('StreamingAssets');
              url = "./StreamingAssets" + parts[parts.length - 1];
          }
          return originalFetch(url, init);
      };

      // 2. THE BRIDGE
      window.initPokiBridge = () => true;
      window.PokiSDK = {
          init: () => Promise.resolve({adblocked: false}),
          commercialBreak: () => Promise.resolve(),
          rewardedBreak: () => {
              document.getElementById('status-text').innerText = "AD REQUESTED";
              return new Promise(resolve => { window._adResolve = resolve; });
          },
          gameplayStart: () => {}, gameplayStop: () => {}
      };
      window.rewardedBreak = window.PokiSDK.rewardedBreak;

      // 3. DEBUG ACTIONS
      function hackMoney() {
          if (!window.uInst) return;
          console.log("💰 Sending Money Commands...");
          const targets = ["GameManager", "CurrencyManager", "InventoryManager", "AdsManager", "Bank"];
          targets.forEach(t => {
              try { window.uInst.SendMessage(t, "AddMoney", 50000); } catch(e){}
              try { window.uInst.SendMessage(t, "AddCurrency", 50000); } catch(e){}
          });
      }

      function forceOpenAd() {
          if (!window.uInst) return;
          const targets = ["AdsManager", "PokiUnitySDK", "AdManager"];
          targets.forEach(t => {
              try { window.uInst.SendMessage(t, "ShowRewarded"); } catch(e){}
              try { window.uInst.SendMessage(t, "rewardedBreak"); } catch(e){}
          });
      }

      function forceSuccess() {
          console.log("🔓 Attempting Nuclear Unfreeze...");
          // Resolve JS
          if (window._adResolve) { window._adResolve(true); window._adResolve = null; }
          // Direct C# Callback
          if (window.uInst) {
              try { window.uInst.SendMessage("AdsManager", "OnRewardedFinished", "true"); } catch(e){}
              try { window.uInst.SendMessage("PokiUnitySDK", "adFinished", "true"); } catch(e){}
              try { window.uInst.SendMessage("AdsManager", "CloseAdInternal"); } catch(e){}
          }
          document.getElementById('status-text').innerText = "COMMAND SENT";
      }
    </script>
  </head>
  <body>

    <div id="debug-ui">
      <div id="status-text">ENGINE LOADING...</div>
      <button class="btn money" onclick="hackMoney()">💰 +50k Money</button>
      <button class="btn ad" onclick="forceOpenAd()">📺 Open Ad UI</button>
      <button class="btn unfreeze" onclick="forceSuccess()">🔓 Force Success</button>
    </div>

    <canvas id="unity-canvas"></canvas>

    <script src="Build/ea153e321edf23b9a40b38d65ce41d01.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/101a0553a2917fd4c62a7e2159d30814.data",
        frameworkUrl: "Build/2809ee090e7f1bf0e1a32425590981e7.framework.js",
        codeUrl: "Build/9d94f3fbc22c5914756c67722e0cdaca.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "master",
        productName: "My Hotel",
        productVersion: "1.0.3"
      }).then((instance) => {
          window.uInst = instance;
          document.getElementById('status-text').innerText = "READY 🟢";
      });
    </script>
  </body>
</html>
