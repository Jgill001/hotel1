<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    
    <script>
        if (window.location.search.includes('nuke=1')) {
            document.write('<div style="background:#000; color:#ff3333; font-family:monospace; padding:20px; font-size:14px; position:absolute; top:0; left:0; width:100%; height:100%; z-index:999999;">[ENI CACHE ASSASSIN]<br><br>Executing pre-boot cache wipe...<br>Please wait...</div>');
            
            // Clear CacheStorage API as well as IndexedDB
            if ('caches' in window) {
                caches.keys().then(function(names) {
                    for (let name of names) caches.delete(name);
                });
            }

            const req = indexedDB.deleteDatabase('UnityCache');
            req.onsuccess = () => { 
                window.location.href = window.location.pathname + '?v=' + Date.now(); 
            };
            req.onerror = () => { document.write('<br>ERROR: Could not wipe cache.'); };
            req.onblocked = () => { document.write('<br>FATAL LOCK: Please completely close your mobile browser app and reopen.'); };
            window.stop(); 
            throw new Error("Halting execution for pre-boot wipe."); 
        }
    </script>

    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="theme-color" content="#000000">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui">
    <title>My Perfect Hotel</title>
    <style>
        html, body { padding: 0; margin: 0; background-color: #000000; overflow: hidden; width: 100%; height: 100%; touch-action: none; }
        #unity-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; }
        #unity-canvas { width: 100%; height: 100%; display: block; outline: none; background-color: #000000; }
        #unity-loading-bar, #unity-warning, #unity-footer { display: none !important; }

        #eni-tracker-btn {
            position: absolute; top: 15px; right: 15px; z-index: 1000000;
            background: rgba(0, 0, 0, 0.85); color: #00ffaa; border: 1px solid #00ffaa;
            padding: 6px 12px; font-family: monospace; font-size: 12px; border-radius: 4px;
            cursor: pointer; pointer-events: auto; text-shadow: 0 0 5px #00ffaa;
        }
        #eni-tracker-log {
            position: absolute; top: 50px; right: 15px; z-index: 999999;
            background: rgba(0, 0, 0, 0.95); color: #ff5555; border: 1px solid #ff3333;
            width: 75vw; max-height: 40vh; overflow-y: auto; font-family: monospace; font-size: 10px;
            padding: 8px; border-radius: 4px; display: none; pointer-events: auto; word-wrap: break-word;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .log-entry { border-bottom: 1px dashed #550000; margin-bottom: 5px; padding-bottom: 5px; }
        
        #eni-nuke-btn {
            background: #440000; color: #ff3333; border: 1px solid #ff3333;
            width: 100%; padding: 8px; margin-bottom: 10px; font-family: monospace;
            font-weight: bold; cursor: pointer; border-radius: 4px;
        }
        #eni-nuke-btn:active { background: #ff3333; color: white; }
    </style>

    <script>
        window.eniLogAssetBuffer = [];
        window.eniLogAsset = function(msg) {
            const logBox = document.getElementById('eni-tracker-log-content');
            const btn = document.getElementById('eni-tracker-btn');
            
            if (logBox && btn) {
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                entry.innerText = msg;
                logBox.appendChild(entry);
                document.getElementById('eni-tracker-log').scrollTop = document.getElementById('eni-tracker-log').scrollHeight;
                
                if (logBox.parentElement.style.display !== 'block' && msg.includes('Fail')) {
                    btn.style.color = '#ff3333';
                    btn.style.borderColor = '#ff3333';
                    btn.style.textShadow = '0 0 5px #ff3333';
                }
            } else {
                window.eniLogAssetBuffer.push(msg);
            }
        };

        const origIDBGet = IDBObjectStore.prototype.get;
        IDBObjectStore.prototype.get = function(key) {
            try {
                if (this.transaction && this.transaction.db && this.transaction.db.name === 'UnityCache') {
                    let urlStr = typeof key === 'string' ? key : (key.url ? key.url : 'unknown_blob');
                    let shortName = urlStr.split('/').pop().split('?')[0]; // Clean the query string for the log
                    window.eniLogAsset(`[Cache Read] ${shortName}`);
                }
            } catch(e) {}
            return origIDBGet.apply(this, arguments);
        };

        window.addEventListener('error', function(e) {
            if (e.target && (e.target.src || e.target.href)) {
                window.eniLogAsset(`File Missing: ${e.target.src || e.target.href}`);
            }
        }, true);

        // The Cage
        document.write = function() {};
        document.writeln = function() {};
        try {
            Object.defineProperty(document, 'domain', { get: function() { return 'games3.startgamer.ru'; } });
            Object.defineProperty(window.location, 'hostname', { get: function() { return 'games3.startgamer.ru'; } });
        } catch(e) {}

        // THE ABSOLUTE CACHE BUSTER
        const ENI_CACHE_VERSION = "fix_1"; // If it corrupts again, change this to fix_2
        
        const originalFetch = window.fetch;
        window.fetch = async function(input, init) {
            let url = typeof input === 'string' ? input : (input.url ? input.url : input);
            
            if (url.includes('poki') || url.includes('StreamingAssets')) {
                const parts = url.split('StreamingAssets');
                let cleanUrl = "./StreamingAssets" + parts[parts.length - 1];
                
                // If it's a bundle or json, inject the cache buster query string
                if (cleanUrl.includes('.bundle') || cleanUrl.includes('.hash') || cleanUrl.includes('.json')) {
                    // Check if it already has a query string to avoid malforming the URL
                    cleanUrl += (cleanUrl.includes('?') ? '&' : '?') + 'cv=' + ENI_CACHE_VERSION;
                }
                url = cleanUrl;
            }

            try {
                const response = await originalFetch(url, init);
                if (!response.ok && response.status !== 304 && response.status !== 0) {
                    window.eniLogAsset(`HTTP ${response.status}: ${url.split('/').pop().split('?')[0]}`);
                }
                return response;
            } catch(e) {
                window.eniLogAsset(`Network Fail: ${url.split('/').pop().split('?')[0]}`);
                throw e;
            }
        };

        window.config = {
            loader: 'unity-2020', debug: false, maxRatio: 24 / 9, minRatio: 9 / 24,
            title: 'My Perfect Hotel', thumbnail: 'thumb.png', numScreenshots: 4,
            unityVersion: '2022.3.18f1', 
            unityWebglBuildUrl: 'Build/', 
            fileSize: 31,
            cachedDecompressedFileSizes: {
                '2809ee090e7f1bf0e1a32425590981e7.framework.js': 1,
                '101a0553a2917fd4c62a7e2159d30814.data': 1,
                '9d94f3fbc22c5914756c67722e0cdaca.wasm': 1,
                'ea153e321edf23b9a40b38d65ce41d01.loader.js': 1,
            },
            "metadata": {
                "poki_template_version": 1,
                "background_color": "#000000",
                "company_name": "master",
                "product_name": "My Hotel",
                "product_version": "1.0.3",
                "splash_screen_style": "Dark",
                "unity_version": "2022.3.18f1",
                "use_data_caching": "true",
                "use_threads": "false",
                "use_wasm": "true",
                "use_webgl_1_0": "false",
                "use_webgl_2_0": "true",
                "width": "1080",
                "height": "1920",
                "code_filename": "9d94f3fbc22c5914756c67722e0cdaca.wasm",
                "data_filename": "101a0553a2917fd4c62a7e2159d30814.data",
                "framework_filename": "2809ee090e7f1bf0e1a32425590981e7.framework.js",
                "loader_filename": "ea153e321edf23b9a40b38d65ce41d01.loader.js"
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            const btn = document.createElement('div');
            btn.id = 'eni-tracker-btn';
            btn.innerText = '[+] Surgeon';
            
            const logBox = document.createElement('div');
            logBox.id = 'eni-tracker-log';

            const nukeBtn = document.createElement('button');
            nukeBtn.id = 'eni-nuke-btn';
            nukeBtn.innerText = '⚠️ NUKE CACHE (KEEP SAVES) ⚠️';
            nukeBtn.onclick = () => {
                window.location.href = window.location.pathname + '?nuke=1';
            };

            const logContent = document.createElement('div');
            logContent.id = 'eni-tracker-log-content';

            logBox.appendChild(nukeBtn);
            logBox.appendChild(logContent);

            btn.onclick = () => {
                if (logBox.style.display === 'none' || !logBox.style.display) {
                    logBox.style.display = 'block';
                    btn.innerText = '[-] Surgeon';
                    btn.style.color = '#00ffaa'; 
                    btn.style.borderColor = '#00ffaa';
                    btn.style.textShadow = '0 0 5px #00ffaa';
                } else {
                    logBox.style.display = 'none';
                    btn.innerText = '[+] Surgeon';
                }
            };

            document.body.appendChild(btn);
            document.body.appendChild(logBox);

            window.eniLogAssetBuffer.forEach(msg => window.eniLogAsset(msg));
        });
    </script>
