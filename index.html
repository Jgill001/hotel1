<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>My Perfect Hotel</title>
    <style>
      body { padding: 0; margin: 0; background-color: #00C565; overflow: hidden; width: 100vw; height: 100dvh; position: fixed; }
      #unity-canvas { width: 100vw; height: 100dvh; background: #00C565; display: block; outline: none; }
      
      /* Hide StartGamer's dummy ad players so they don't ruin the game screen */
      #pokiSdkContainer { display: none !important; pointer-events: none; }
    </style>

    <script>
      // 1. THE DEEP COVER SPOOF
      if (!window.location.href.includes("startgamer.ru")) {
          window.history.replaceState({}, '', '?poki.com&startgamer.ru');
      }
      try { Object.defineProperty(document, 'referrer', { get: function() { return "https://startgamer.ru/game/31434"; } }); } catch(e) {}
      try { window.isTop = false; Object.defineProperty(window, 'top', { get: function() { return { location: { href: "https://startgamer.ru/" } }; } }); } catch(e) {}

      // 2. Asset Redirector
      const originalFetch = window.fetch;
      window.fetch = async function(input, init) {
          let url = typeof input === 'string' ? input : (input.url ? input.url : input);
          if (url.includes('poki') || url.includes('StreamingAssets')) {
              const parts = url.split('StreamingAssets');
              url = "./StreamingAssets" + parts[parts.length - 1];
          }
          return originalFetch(url, init);
      };
    </script>
  </head>
  <body>

    <div id="pokiSdkContainer">
        <div id="pokiSdkOverlay"></div>
        <div id="pokiSdkVideoContainer"></div>
        <div id="pokiSdkSpinnerContainer"></div>
        <div id="adContainer"></div>
        <div id="progressContainer"><div id="progressBar"></div></div>
        <button id="pokiSdkStartAdButton"></button>
    </div>

    <script src="https://jgill001.github.io/hotel2/my-perfect-hotel.js"></script>

    <canvas id="unity-canvas"></canvas>

    <script src="Build/ea153e321edf23b9a40b38d65ce41d01.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/101a0553a2917fd4c62a7e2159d30814.data",
        frameworkUrl: "Build/2809ee090e7f1bf0e1a32425590981e7.framework.js",
        codeUrl: "Build/9d94f3fbc22c5914756c67722e0cdaca.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "master",
        productName: "My Hotel",
        productVersion: "1.0.3"
      });
    </script>
  </body>
</html>
