<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Perfect Hotel - Local Mirror</title>
    <style>
      body { padding: 0; margin: 0; background-color: #00C565; overflow: hidden; width: 100vw; height: 100vh; }
      #unity-canvas { width: 100%; height: 100%; background: #00C565; }
      #debug-console { position: absolute; top: 10px; left: 10px; color: #00FF00; background: rgba(0,0,0,0.85); padding: 10px; z-index: 9999; font-family: monospace; font-size: 11px; pointer-events: none; max-width: 90vw; word-wrap: break-word; }
    </style>
    
    <script>
      (function() {
          const originalFetch = window.fetch;
          window.fetch = function(input, init) {
              let url = typeof input === 'string' ? input : (input.url ? input.url : input);
              
              if (typeof url === 'string' && (url.includes('poki') || url.includes('StreamingAssets'))) {
                  const parts = url.split('StreamingAssets');
                  const localPath = "./StreamingAssets" + parts[parts.length - 1];
                  
                  // If it's asking for a bundle, log it to the screen so we can heist it next!
                  if (localPath.includes('.bundle') || localPath.includes('.hash')) {
                      document.getElementById("debug-console").innerHTML += "<br><span style='color:yellow'>MISSING BUNDLE: " + parts[parts.length - 1] + "</span>";
                  }
                  
                  return originalFetch(localPath, init);
              }
              return originalFetch(input, init);
          };

          const oxhr = window.XMLHttpRequest.prototype.open;
          window.XMLHttpRequest.prototype.open = function(m, url) {
              if (typeof url === 'string' && (url.includes('poki') || url.includes('StreamingAssets'))) {
                  const parts = url.split('StreamingAssets');
                  url = "./StreamingAssets" + parts[parts.length - 1];
              }
              return oxhr.apply(this, arguments);
          };

          // Maintain the "Poki" identity for internal sitelocks
          Object.defineProperty(document, 'URL', { get: () => "https://poki.com/en/g/my-perfect-hotel" });
          Object.defineProperty(document, 'domain', { get: () => "poki.com" });
      })();

      window.initPokiBridge = function() { return true; };
      window.PokiSDK = new Proxy({}, { get: () => function() { return Promise.resolve(true); } });
    </script>
  </head>
  <body>
    <div id="debug-console">Loading Local Assets...</div>
    <canvas id="unity-canvas"></canvas>
    <script src="Build/ea153e321edf23b9a40b38d65ce41d01.loader.js"></script>
    <script>
      var config = {
        dataUrl: "Build/101a0553a2917fd4c62a7e2159d30814.data",
        frameworkUrl: "Build/2809ee090e7f1bf0e1a32425590981e7.framework.js",
        codeUrl: "Build/9d94f3fbc22c5914756c67722e0cdaca.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "master",
        productName: "My Hotel",
        productVersion: "1.0.3"
      };
      createUnityInstance(document.querySelector("#unity-canvas"), config).then(() => {
          document.getElementById("debug-console").innerHTML += "<br><span style='color:cyan'>ENGINE FULLY INITIALIZED</span>";
      });
    </script>
  </body>
</html>
