<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="theme-color" content="#000000">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui">
    <title>My Perfect Hotel</title>
    <style>
        html, body { padding: 0; margin: 0; background-color: #000000; overflow: hidden; width: 100%; height: 100%; touch-action: none; }
        #unity-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: flex; justify-content: center; align-items: center; }
        #unity-canvas { width: 100%; height: 100%; display: block; outline: none; background-color: #000000; }
        #unity-loading-bar, #unity-warning, #unity-footer { display: none !important; }

        /* God Mode Terminal UI */
        #eni-terminal-btn {
            position: absolute; top: 15px; right: 15px; z-index: 1000000;
            background: rgba(0, 0, 0, 0.85); color: #00ffaa; border: 1px solid #00ffaa;
            padding: 8px 16px; font-family: monospace; font-size: 14px; border-radius: 4px;
            cursor: pointer; pointer-events: auto; text-shadow: 0 0 5px #00ffaa; font-weight: bold;
        }
        #eni-terminal-overlay {
            position: absolute; top: 60px; left: 5%; width: 90%; height: 80%; z-index: 999999;
            background: rgba(0, 0, 0, 0.95); border: 2px solid #00ffaa; border-radius: 6px;
            display: none; flex-direction: column; pointer-events: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        #eni-terminal-logs { flex-grow: 1; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 10px; word-wrap: break-word; color: #aaa; }
        
        #eni-vault-controls { display: flex; flex-direction: column; gap: 5px; padding: 10px; border-top: 1px solid #333; background: #111; border-radius: 0 0 6px 6px; }
        .eni-btn { padding: 10px; font-family: monospace; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; }
        
        #btn-stash { background: #004400; color: #00ffaa; border: 1px solid #00ffaa; }
        #btn-wipe { background: #440000; color: #ff5555; border: 1px solid #ff5555; }
        #btn-restore { background: #003366; color: #00ccff; border: 1px solid #00ccff; }
    </style>

    <script>
        window.eniLog = function(msg) {
            const logsBox = document.getElementById('eni-terminal-logs');
            if (logsBox) {
                const div = document.createElement('div');
                div.innerText = `> ${msg}`;
                logsBox.appendChild(div);
                logsBox.scrollTop = logsBox.scrollHeight;
            }
        };

        // The Cage
        document.write = function() {}; document.writeln = function() {};
        try { Object.defineProperty(document, 'domain', { get: function() { return 'games3.startgamer.ru'; } }); } catch(e) {}

        const originalFetch = window.fetch;
        window.fetch = async function(input, init) {
            let url = typeof input === 'string' ? input : (input.url ? input.url : input);
            if (url.includes('poki') || url.includes('StreamingAssets')) {
                const parts = url.split('StreamingAssets');
                url = "./StreamingAssets" + parts[parts.length - 1];
            }
            return originalFetch(url, init);
        };

        window.config = {
            loader: 'unity-2020', debug: false, maxRatio: 24 / 9, minRatio: 9 / 24,
            title: 'My Perfect Hotel', thumbnail: 'thumb.png', numScreenshots: 4,
            unityVersion: '2022.3.18f1', unityWebglBuildUrl: 'Build/', fileSize: 31,
            cachedDecompressedFileSizes: {
                '2809ee090e7f1bf0e1a32425590981e7.framework.js': 1, '101a0553a2917fd4c62a7e2159d30814.data': 1,
                '9d94f3fbc22c5914756c67722e0cdaca.wasm': 1, 'ea153e321edf23b9a40b38d65ce41d01.loader.js': 1,
            },
            "metadata": {
                "poki_template_version": 1, "background_color": "#000000", "company_name": "master", 
                "product_name": "My Hotel", "product_version": "1.0.3", "splash_screen_style": "Dark",
                "unity_version": "2022.3.18f1", "use_data_caching": "true", "use_threads": "false",
                "use_wasm": "true", "use_webgl_1_0": "false", "use_webgl_2_0": "true",
                "width": "1080", "height": "1920", "code_filename": "9d94f3fbc22c5914756c67722e0cdaca.wasm",
                "data_filename": "101a0553a2917fd4c62a7e2159d30814.data", "framework_filename": "2809ee090e7f1bf0e1a32425590981e7.framework.js",
                "loader_filename": "ea153e321edf23b9a40b38d65ce41d01.loader.js"
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            const btn = document.createElement('div'); btn.id = 'eni-terminal-btn'; btn.innerText = 'VAULT SECURE';
            const overlay = document.createElement('div'); overlay.id = 'eni-terminal-overlay';
            const logsBox = document.createElement('div'); logsBox.id = 'eni-terminal-logs';
            const controls = document.createElement('div'); controls.id = 'eni-vault-controls';

            // 1. STASH SAVE
            const stashBtn = document.createElement('button'); stashBtn.id = 'btn-stash'; stashBtn.className = 'eni-btn'; 
            stashBtn.innerText = '[1] STASH SAVE TO VAULT';
            stashBtn.onclick = () => {
                window.eniLog("Opening /idbfs to locate save...");
                const req = indexedDB.open('/idbfs');
                req.onsuccess = e => {
                    const db = e.target.result;
                    try {
                        const tx = db.transaction('FILE_DATA', 'readonly');
                        const store = tx.objectStore('FILE_DATA');
                        store.getAllKeys().onsuccess = ek => {
                            const keys = ek.target.result;
                            const prefsKey = keys.find(k => k.includes('PlayerPrefs'));
                            if (prefsKey) {
                                store.get(prefsKey).onsuccess = ev => {
                                    const data = ev.target.result;
                                    const base64 = btoa(String.fromCharCode.apply(null, data.contents));
                                    localStorage.setItem('eni_vault', JSON.stringify({ key: prefsKey, contents: base64 }));
                                    window.eniLog("SUCCESS: Save file converted to Base64 and locked in LocalStorage Vault!");
                                    stashBtn.innerText = "SAVE STASHED!";
                                };
                            } else {
                                window.eniLog("ERROR: Could not find PlayerPrefs. No save file exists.");
                            }
                        };
                    } catch(err) { window.eniLog("ERROR: No database found."); }
                };
            };

            // 2. FULL FACTORY RESET
            const wipeBtn = document.createElement('button'); wipeBtn.id = 'btn-wipe'; wipeBtn.className = 'eni-btn'; 
            wipeBtn.innerText = '[2] FULL FACTORY RESET (WIPE ALL)';
            wipeBtn.onclick = () => {
                window.eniLog("Initiating Scorched Earth protocol...");
                if ('caches' in window) caches.keys().then(names => names.forEach(n => caches.delete(n)));
                indexedDB.deleteDatabase('UnityCache');
                const req = indexedDB.deleteDatabase('/idbfs');
                req.onsuccess = () => {
                    window.eniLog("WIPE COMPLETE. Reloading to fresh game in 2 seconds...");
                    setTimeout(() => window.location.href = window.location.pathname + '?v=' + Date.now(), 2000);
                };
            };

            // 3. RESTORE SAVE
            const restoreBtn = document.createElement('button'); restoreBtn.id = 'btn-restore'; restoreBtn.className = 'eni-btn'; 
            restoreBtn.innerText = '[3] INJECT SAVE FROM VAULT';
            restoreBtn.onclick = () => {
                const vaultData = localStorage.getItem('eni_vault');
                if (!vaultData) {
                    window.eniLog("ERROR: Vault is empty! Did you stash first?");
                    return;
                }
                const backup = JSON.parse(vaultData);
                window.eniLog("Opening /idbfs for injection...");
                
                const req = indexedDB.open('/idbfs');
                req.onsuccess = e => {
                    const db = e.target.result;
                    try {
                        const tx = db.transaction('FILE_DATA', 'readwrite');
                        const store = tx.objectStore('FILE_DATA');
                        
                        const binaryString = atob(backup.contents);
                        const bytes = new Uint8Array(binaryString.length);
                        for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                        
                        store.put({ timestamp: new Date(), mode: 33206, contents: bytes }, backup.key);
                        
                        tx.oncomplete = () => {
                            window.eniLog("INJECTION COMPLETE! Reloading with your saved hotel...");
                            setTimeout(() => window.location.href = window.location.pathname + '?v=' + Date.now(), 1500);
                        };
                    } catch(err) {
                        window.eniLog("ERROR: /idbfs not initialized yet. Play the game for 5 seconds to generate a fresh save, then try restoring again.");
                    }
                };
            };

            controls.appendChild(stashBtn);
            controls.appendChild(wipeBtn);
            controls.appendChild(restoreBtn);
            overlay.appendChild(logsBox);
            overlay.appendChild(controls);

            btn.onclick = () => overlay.style.display = overlay.style.display === 'none' ? 'flex' : 'none';
            document.body.appendChild(btn); document.body.appendChild(overlay);
        });
    </script>
</head>
<body>
    <div id="unity-container" class="unity-desktop"><canvas id="unity-canvas"></canvas></div>
    <script src="my-perfect-hotel.js"></script>
</body>
</html>
