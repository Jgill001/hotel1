<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Perfect Hotel - Private Server</title>
    <style>
      body { padding: 0; margin: 0; background-color: #00C565; overflow: hidden; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
      #unity-canvas { width: 100%; height: 100%; background: #00C565; }
      
      /* The Force Start Button */
      #start-overlay {
        position: absolute; width: 100%; height: 100%; top: 0; left: 0;
        background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center;
        z-index: 10000; cursor: pointer; color: white; font-family: sans-serif; font-size: 24px; font-weight: bold;
      }
    </style>
    <script>
      // 1. Domain Spoofer
      try {
          Object.defineProperty(document, 'URL', { get: () => "https://poki.com/en/g/my-perfect-hotel" });
          Object.defineProperty(document, 'domain', { get: () => "poki.com" });
          Object.defineProperty(document, 'referrer', { get: () => "https://poki.com/" });
      } catch(e) {}

      // 2. Complex Poki Mock
      window.PokiSDK = new Proxy({}, {
          get: (t, p) => {
              if (p === 'then') return undefined;
              return () => {
                  console.log("SDK Call intercepted: " + String(p));
                  return Promise.resolve(true);
              };
          }
      });
      window.initPokiBridge = function() { return true; };
    </script>
  </head>
  <body>
    <div id="start-overlay" onclick="startGame()">TAP TO START HOTEL</div>
    
    <canvas id="unity-canvas"></canvas>
    <script src="Build/ea153e321edf23b9a40b38d65ce41d01.loader.js"></script>
    
    <script>
      var unityInstance = null;
      var config = {
        dataUrl: "Build/101a0553a2917fd4c62a7e2159d30814.data",
        frameworkUrl: "Build/2809ee090e7f1bf0e1a32425590981e7.framework.js",
        codeUrl: "Build/9d94f3fbc22c5914756c67722e0cdaca.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "master",
        productName: "My Hotel",
        productVersion: "1.0.3",
        // Restoring the full engine metadata
        metadata: {
            "poki_template_version": 1,
            "background_color": "#00C565",
            "unity_version": "2022.3.62f2",
            "use_webgl_2_0": "true"
        }
      };

      // Load the instance immediately
      createUnityInstance(document.querySelector("#unity-canvas"), config).then((ui) => {
          unityInstance = ui;
          console.log("Engine Ready.");
      });

      function startGame() {
          // A. Remove overlay
          document.getElementById('start-overlay').style.display = 'none';
          
          // B. Force Resume Audio (Bypasses the 95% hang)
          if (window.AudioContext || window.webkitAudioContext) {
              var AudioContext = window.AudioContext || window.webkitAudioContext;
              var ctx = new AudioContext();
              ctx.resume().then(() => { console.log("Audio Resumed."); });
          }

          // C. Poke the SDK mock to tell Unity "Ad is over"
          if (window.PokiSDK && unityInstance) {
              console.log("Forcing Game Start Signal...");
          }
      }
    </script>
  </body>
</html>
