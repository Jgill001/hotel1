<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Perfect Hotel - The Wiretap</title>
    <style>
      body { padding: 0; margin: 0; background-color: #00C565; overflow: hidden; width: 100vw; height: 100vh; }
      #unity-canvas { width: 100%; height: 100%; background: #00C565; }
     
    <script>
      (function() {
          const originalFetch = window.fetch;
          const ogConsoleError = console.error;
          const ogConsoleWarn = console.warn;
          const missingFiles = new Set();
          
          window.logToScreen = function(msg) {
              const textArea = document.getElementById("debug-log");
              if(textArea) {
                  textArea.value += msg + '\n';
                  textArea.scrollTop = textArea.scrollHeight;
              }
          };

          // 1. The Network Sniffer (Looking for Round 2 Bundles)
          window.fetch = function(input, init) {
              let url = typeof input === 'string' ? input : (input.url ? input.url : input);
              if (typeof url === 'string' && (url.includes('poki') || url.includes('StreamingAssets'))) {
                  const parts = url.split('StreamingAssets');
                  const localPath = "./StreamingAssets" + parts[parts.length - 1];
                  
                  const fileName = parts[parts.length - 1];
                  if (fileName.includes('.bundle') || fileName.includes('.hash') || fileName.includes('.json')) {
                      if (!missingFiles.has(fileName)) {
                          missingFiles.add(fileName);
                          logToScreen('[NETWORK] Missing: ' + fileName);
                      }
                  }
                  return originalFetch(localPath, init);
              }
              return originalFetch(input, init);
          };

          // XHR Sniffer for older engines
          const oxhr = window.XMLHttpRequest.prototype.open;
          window.XMLHttpRequest.prototype.open = function(m, url) {
              if (typeof url === 'string' && (url.includes('poki') || url.includes('StreamingAssets'))) {
                  const parts = url.split('StreamingAssets');
                  url = "./StreamingAssets" + parts[parts.length - 1];
              }
              return oxhr.apply(this, arguments);
          };

          // 2. The Engine Error Sniffer (Catching C# Crashes)
          console.error = function(...args) {
              logToScreen('[ERROR] ' + args.join(' '));
              ogConsoleError.apply(console, args);
          };
          
          console.warn = function(...args) {
              // Filtering out common harmless Unity warnings to keep the log clean
              const msg = args.join(' ');
              if (!msg.includes('AudioContext') && !msg.includes('dpcm')) {
                  logToScreen('[WARN] ' + msg);
              }
              ogConsoleWarn.apply(console, args);
          };

          // 3. The SDK Interceptor (Watching the Poki Handshake)
          window.initPokiBridge = function() { 
              logToScreen('[POKI SDK] Bridge Initialized'); 
              return true; 
          };
          
          window.PokiSDK = new Proxy({}, { 
              get: (target, prop) => {
                  if (prop === 'then') return undefined;
                  return (...args) => {
                      logToScreen('[POKI SDK] Called Method: ' + String(prop));
                      // We resolve everything so the game doesn't hang waiting for an ad
                      return Promise.resolve(true); 
                  };
              } 
          });

          // Sitelock Spoofing
          Object.defineProperty(document, 'URL', { get: () => "https://poki.com/en/g/my-perfect-hotel" });
          Object.defineProperty(document, 'domain', { get: () => "poki.com" });
      })();
    </script>
  </head>
  <body>
    <div id="debug-console">
      <p id="debug-title">THE WIRETAP</p>
      <textarea id="debug-log" readonly></textarea>
      <button id="copy-btn" onclick="copyLog()">COPY DEBUG LOG</button>
    </div>

    <canvas id="unity-canvas"></canvas>
    <script src="Build/ea153e321edf23b9a40b38d65ce41d01.loader.js"></script>
    <script>
      var config = {
        dataUrl: "Build/101a0553a2917fd4c62a7e2159d30814.data",
        frameworkUrl: "Build/2809ee090e7f1bf0e1a32425590981e7.framework.js",
        codeUrl: "Build/9d94f3fbc22c5914756c67722e0cdaca.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "master",
        productName: "My Hotel",
        productVersion: "1.0.3"
      };
      
      createUnityInstance(document.querySelector("#unity-canvas"), config).catch((err) => {
          console.error("Unity Load Crash: " + err);
      });

      function copyLog() {
          const textArea = document.getElementById("debug-log");
          textArea.select();
          document.execCommand('copy');
          const btn = document.getElementById("copy-btn");
          btn.innerText = "LOG COPIED!";
          btn.style.background = "#00FF00";
          btn.style.color = "#000";
          setTimeout(() => {
              btn.innerText = "COPY DEBUG LOG";
              btn.style.background = "#FF0000";
              btn.style.color = "#FFF";
          }, 2000);
      }
    </script>
  </body>
</html>
