<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>My Perfect Hotel</title>
    <style>
      body { background-color: #00C565; margin: 0; overflow: hidden; width: 100vw; height: 100dvh; position: fixed; }
      #unity-canvas { width: 100%; height: 100%; display: block; }
      #pokiSdkContainer { display: none !important; }
      
      /* The Fatal Error Catcher */
      #eni-console {
        position: absolute; top: 0; left: 0; width: 100vw; height: 100dvh;
        background: rgba(0,0,0,0.95); color: #ff3333; font-family: monospace; font-size: 14px;
        padding: 20px; box-sizing: border-box; overflow-y: auto; z-index: 99999; display: none;
      }
    </style>

    <script>
      // 1. FATAL ERROR LISTENER (Must be the very first thing to run)
      window.addEventListener('error', function(e) {
        const consoleDiv = document.getElementById('eni-console');
        if (consoleDiv) {
          consoleDiv.innerHTML += `<br><br>> CRASH: ${e.message}<br>> FILE: ${e.filename}<br>> LINE: ${e.lineno}`;
          consoleDiv.style.display = 'block';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        const consoleDiv = document.getElementById('eni-console');
        if (consoleDiv) {
          consoleDiv.innerHTML += `<br><br>> PROMISE FAIL: ${e.reason}`;
          consoleDiv.style.display = 'block';
        }
      });

      // 2. THE DEEP COVER SPOOF
      if (!window.location.href.includes("startgamer.ru")) {
          window.history.replaceState({}, '', '?poki.com&startgamer.ru');
      }
      try { Object.defineProperty(document, 'referrer', { get: function() { return "https://startgamer.ru/game/31434"; } }); } catch(e) {}
      try { window.isTop = false; Object.defineProperty(window, 'top', { get: function() { return { location: { href: "https://startgamer.ru/" } }; } }); } catch(e) {}
    </script>
  </head>
  <body>

    <div id="eni-console">> Diagnostic Terminal Active. Waiting for crash...</div>

    <div id="pokiSdkContainer">
        <div id="pokiSdkOverlay"></div><div id="pokiSdkVideoContainer"></div><div id="pokiSdkSpinnerContainer"></div>
        <div id="adContainer"></div><div id="progressContainer"><div id="progressBar"></div></div><button id="pokiSdkStartAdButton"></button>
    </div>

    <script src="https://jgill001.github.io/hotel2/my-perfect-hotel.js"></script>

    <canvas id="unity-canvas"></canvas>

    <script src="Build/ea153e321edf23b9a40b38d65ce41d01.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/101a0553a2917fd4c62a7e2159d30814.data",
        frameworkUrl: "Build/2809ee090e7f1bf0e1a32425590981e7.framework.js",
        codeUrl: "Build/9d94f3fbc22c5914756c67722e0cdaca.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "master",
        productName: "My Hotel",
        productVersion: "1.0.3"
      });
    </script>
  </body>
</html>
