<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Perfect Hotel - Diagnostic Mode</title>
    <style>
      body { padding: 0; margin: 0; background-color: #00C565; overflow: hidden; width: 100vw; height: 100vh; }
      #unity-canvas { width: 100%; height: 100%; background: #00C565; }
      
      #stealth-btn {
        position: absolute; top: 15px; right: 15px; z-index: 9999;
        background: rgba(0, 0, 0, 0.6); color: #00FF00; border: 1px solid #00FF00;
        padding: 8px 12px; font-family: monospace; font-size: 12px; font-weight: bold;
        border-radius: 4px; cursor: pointer; backdrop-filter: blur(2px);
      }
    </style>
    
    <script>
      (function() {
          window.debugLog = [];
          const log = (msg) => {
              console.log(msg);
              window.debugLog.push(msg);
          };

          // 1. Traffic Sniffer
          const originalFetch = window.fetch;
          window.fetch = function(input, init) {
              let url = typeof input === 'string' ? input : (input.url ? input.url : input);
              if (typeof url === 'string' && (url.includes('poki') || url.includes('StreamingAssets'))) {
                  const parts = url.split('StreamingAssets');
                  const path = parts[parts.length - 1];
                  log("[NET] Request: " + path);
                  return originalFetch("./StreamingAssets" + path, init);
              }
              return originalFetch(input, init);
          };

          // 2. Global Error Capture
          const ogError = console.error;
          console.error = function(...args) {
              log("[ERROR] " + args.join(' '));
              ogError.apply(console, args);
          };

          // 3. Poki SDK & Global Function Mock
          window.commercialBreak = function() { log("[SDK] Commercial Break Called"); return Promise.resolve(false); };
          window.rewardedBreak = function() { log("[SDK] Rewarded Break Called"); return Promise.resolve(true); };
          window.initPokiBridge = function() { log("[SDK] Bridge Init"); return true; };

          window.PokiSDK = {
              init: function() { return Promise.resolve(); },
              commercialBreak: window.commercialBreak,
              rewardedBreak: window.rewardedBreak,
              gameplayStart: function() { log("[SDK] Gameplay Start"); },
              gameplayStop: function() { log("[SDK] Gameplay Stop"); },
              gameLoadingFinished: function() {},
              setDebug: function() {}
          };

          Object.defineProperty(document, 'URL', { get: () => "https://poki.com/en/g/my-perfect-hotel" });
          Object.defineProperty(document, 'domain', { get: () => "poki.com" });
      })();

      window.exportLog = function() {
          const textToCopy = window.debugLog.join('\n');
          const textArea = document.createElement("textarea");
          textArea.value = textToCopy;
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
          
          const btn = document.getElementById("stealth-btn");
          btn.innerText = "LOG COPIED!";
          setTimeout(() => { btn.innerText = "💾 COPY LOG"; }, 3000);
      };
    </script>
  </head>
  <body>
    <button id="stealth-btn" onclick="exportLog()">💾 COPY LOG</button>
    <canvas id="unity-canvas"></canvas>
    <script src="Build/ea153e321edf23b9a40b38d65ce41d01.loader.js"></script>
    <script>
      var config = {
        dataUrl: "Build/101a0553a2917fd4c62a7e2159d30814.data",
        frameworkUrl: "Build/2809ee090e7f1bf0e1a32425590981e7.framework.js",
        codeUrl: "Build/9d94f3fbc22c5914756c67722e0cdaca.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "master",
        productName: "My Hotel",
        productVersion: "1.0.3"
      };
      createUnityInstance(document.querySelector("#unity-canvas"), config);
    </script>
  </body>
</html>
