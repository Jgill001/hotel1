<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Perfect Hotel - The Real Fix</title>
    <style>
      body { padding: 0; margin: 0; background-color: #00C565; overflow: hidden; width: 100vw; height: 100dvh; position: fixed; }
      #unity-canvas { width: 100vw; height: 100dvh; background: #00C565; display: block; }
      #log-btn { position: absolute; top: 10px; right: 10px; z-index: 9999; background: rgba(0,0,0,0.4); color: #00FF00; border: 1px solid #00FF00; padding: 8px; border-radius: 4px; font-family: monospace; }
    </style>
    <script>
      (function() {
          window.heistLog = [];
          const track = (msg) => { window.heistLog.push(`${new Date().toLocaleTimeString()} ${msg}`); console.log(msg); };

          window.Pointer_stringify = function(ptr) { return window.UTF8ToString ? window.UTF8ToString(ptr) : "Legacy"; };

          const originalFetch = window.fetch;
          window.fetch = function(input, init) {
              let url = typeof input === 'string' ? input : (input.url ? input.url : input);
              if (typeof url === 'string' && (url.includes('poki') || url.includes('StreamingAssets'))) {
                  const parts = url.split('StreamingAssets');
                  return originalFetch("./StreamingAssets" + parts[parts.length - 1], init);
              }
              return originalFetch(input, init);
          };

          // --- THE PROPER SDK MOCK ---
          window.PokiSDK = {
              init: () => Promise.resolve(),
              
              // Interstitials
              commercialBreak: function(pauseCallback) {
                  track("SDK: Commercial Break Requested");
                  // Execute the game's internal pause function if it provided one
                  if (typeof pauseCallback === 'function') {
                      track("SDK: Executing Game's Pause Callback");
                      try { pauseCallback(); } catch(e) {}
                  }
                  return new Promise((resolve) => {
                      setTimeout(() => { resolve(false); }, 500);
                  });
              },
              
              // Rewards
              rewardedBreak: function(pauseCallback) {
                  track("SDK: Rewarded Break REQUESTED");
                  
                  // CRITICAL FIX: We MUST tell the game to pause using its own callback
                  if (typeof pauseCallback === 'function') {
                      track("SDK: Executing Game's Internal Pause Callback");
                      try { pauseCallback(); } catch(e) { track("Pause Error: " + e); }
                  }
                  
                  return new Promise((resolve) => {
                      setTimeout(() => {
                          track("SDK: Resolving Reward Success");
                          
                          // Force window focus just in case WebGL suspended its audio thread
                          window.focus(); 
                          
                          resolve(true); 
                      }, 1200);
                  });
              },
              
              // These are just telemetry hooks the game uses to talk to Poki. We just listen.
              gameplayStart: () => { track("GAME TELLS SDK: Playing"); },
              gameplayStop: () => { track("GAME TELLS SDK: Stopped"); },
              gameLoadingFinished: () => {},
              gameInteractive: () => {},
              setDebug: () => {}
          };

          window.rewardedBreak = window.PokiSDK.rewardedBreak;
          window.commercialBreak = window.PokiSDK.commercialBreak;
          window.initPokiBridge = () => true;

          Object.defineProperty(document, 'URL', { get: () => "https://poki.com/en/g/my-perfect-hotel" });
          Object.defineProperty(document, 'domain', { get: () => "poki.com" });
      })();

      window.copyHeistLog = function() {
          const textArea = document.createElement("textarea");
          textArea.value = window.heistLog.join('\n');
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
      };
      
      function fixCanvasSize() {
          const canvas = document.querySelector("#unity-canvas");
          if (canvas) { canvas.style.height = window.innerHeight + "px"; canvas.style.width = window.innerWidth + "px"; }
      }
      window.addEventListener('resize', fixCanvasSize);
    </script>
  </head>
  <body onload="fixCanvasSize()">
    <button id="log-btn" onclick="copyHeistLog()">💾 LOG</button>
    <canvas id="unity-canvas"></canvas>
    <script src="Build/ea153e321edf23b9a40b38d65ce41d01.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/101a0553a2917fd4c62a7e2159d30814.data",
        frameworkUrl: "Build/2809ee090e7f1bf0e1a32425590981e7.framework.js",
        codeUrl: "Build/9d94f3fbc22c5914756c67722e0cdaca.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "master",
        productName: "My Hotel",
        productVersion: "1.0.3"
      });
    </script>
  </body>
</html>
