<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>My Perfect Hotel</title>
    <style>
      /* THE EXACT CSS FROM THE WORKING VERSION */
      body { padding: 0; margin: 0; background-color: #00C565; overflow: hidden; width: 100vw; height: 100dvh; position: fixed; }
      #unity-canvas { width: 100vw; height: 100dvh; background: #00C565; display: block; outline: none; }
      
      /* FLOATING BUTTONS - These do not affect the game's size/scale */
      #debug-menu {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 999;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .btn {
        padding: 12px;
        background: rgba(0, 0, 0, 0.8);
        color: #00FF00;
        border: 2px solid #00FF00;
        cursor: pointer;
        font-weight: bold;
        font-family: sans-serif;
        border-radius: 5px;
      }
    </style>

    <script>
      // 1. THE REDIRECTOR (Required for load)
      const originalFetch = window.fetch;
      window.fetch = async function(input, init) {
          let url = typeof input === 'string' ? input : (input.url ? input.url : input);
          if (url.includes('poki') || url.includes('StreamingAssets')) {
              const parts = url.split('StreamingAssets');
              url = "./StreamingAssets" + parts[parts.length - 1];
          }
          return originalFetch(url, init);
      };

      // 2. THE BRIDGE (Required to fix green screen)
      window.initPokiBridge = () => true;
      window.PokiSDK = {
          init: () => Promise.resolve({adblocked: false}),
          commercialBreak: () => Promise.resolve(),
          rewardedBreak: () => {
              return new Promise(resolve => { window._adResolve = resolve; });
          },
          gameplayStart: () => {},
          gameplayStop: () => {}
      };
      window.rewardedBreak = window.PokiSDK.rewardedBreak;

      // 3. THE BUTTON LOGIC
      function addCash() {
          if (!window.uInst) return;
          // Shotgun blast of possible names
          const objs = ["AdsManager", "GameManager", "CurrencyManager", "PokiUnitySDK"];
          objs.forEach(o => {
              try { window.uInst.SendMessage(o, "AddMoney", 100000); } catch(e){}
              try { window.uInst.SendMessage(o, "AddCurrency", 100000); } catch(e){}
          });
      }

      function forceSuccess() {
          if (window._adResolve) {
              window._adResolve(true);
              window._adResolve = null;
          }
          if (window.uInst) {
              try { window.uInst.SendMessage("AdsManager", "OnRewardedFinished", "true"); } catch(e){}
              try { window.uInst.SendMessage("PokiUnitySDK", "adFinished", "true"); } catch(e){}
          }
      }
    </script>
  </head>
  <body>

    <div id="debug-menu">
      <button class="btn" onclick="addCash()">💰 ADD CASH</button>
      <button class="btn" onclick="forceSuccess()" style="border-color: red; color: red;">🔓 FORCE REWARD</button>
    </div>

    <canvas id="unity-canvas" tabindex="1"></canvas>

    <script src="Build/ea153e321edf23b9a40b38d65ce41d01.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/101a0553a2917fd4c62a7e2159d30814.data",
        frameworkUrl: "Build/2809ee090e7f1bf0e1a32425590981e7.framework.js",
        codeUrl: "Build/9d94f3fbc22c5914756c67722e0cdaca.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "master",
        productName: "My Hotel",
        productVersion: "1.0.3"
      }).then((instance) => {
          window.uInst = instance;
      });
    </script>
  </body>
</html>
