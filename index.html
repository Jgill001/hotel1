<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>Hotel Clean Pinpoint</title>
    <style>
      /* EXACT ORIGINAL CSS - NO CHANGES */
      body { padding: 0; margin: 0; background-color: #00C565; overflow: hidden; width: 100vw; height: 100dvh; position: fixed; }
      #unity-canvas { width: 100vw; height: 100dvh; background: #00C565; display: block; outline: none; }
      
      /* Tiny floating controls that won't break scaling */
      #pinpoint-ui {
        position: absolute; top: 5px; right: 5px; z-index: 1000;
        display: flex; flex-direction: column; gap: 4px;
      }
      .mini-btn {
        padding: 6px; background: rgba(0,0,0,0.7); color: #00FF00;
        border: 1px solid #00FF00; font-size: 10px; cursor: pointer; font-family: monospace;
      }
    </style>

    <script>
      // 1. REDIRECTOR
      const originalFetch = window.fetch;
      window.fetch = async function(input, init) {
          let url = typeof input === 'string' ? input : (input.url ? input.url : input);
          if (url.includes('poki') || url.includes('StreamingAssets')) {
              const parts = url.split('StreamingAssets');
              url = "./StreamingAssets" + parts[parts.length - 1];
          }
          return originalFetch(url, init);
      };

      // 2. THE MANDATORY BRIDGE
      window.initPokiBridge = () => true;
      window.PokiSDK = {
          init: () => Promise.resolve({adblocked: false}),
          commercialBreak: () => Promise.resolve(),
          rewardedBreak: () => new Promise(resolve => { window._adRes = resolve; }),
          gameplayStart: () => {}, gameplayStop: () => {}
      };
      window.rewardedBreak = window.PokiSDK.rewardedBreak;

      // 3. THE PINPOINT SCANNER
      // This function scans the Unity engine for its actual internal object names
      function scanAndInject() {
          if (!window.uInst) return;
          console.log("🔍 SCANNING FOR MONEY OBJECTS...");
          
          // We will try every common Poki-Unity internal name
          const objects = ["PokiUnitySDK", "AdsManager", "AdManager", "GameManager", "Main", "Inventory", "CurrencyManager"];
          const methods = ["OnRewardedFinished", "onRewardedBreakComplete", "AddMoney", "AddCurrency", "GrantReward"];

          objects.forEach(obj => {
              methods.forEach(meth => {
                  // Attempting to send "true" or a high number to every possible combination
                  try { window.uInst.SendMessage(obj, meth, "true"); } catch(e){}
                  try { window.uInst.SendMessage(obj, meth, 1000000); } catch(e){}
              });
          });
          alert("Injection attempts sent. Check your money!");
      }

      function forceSuccess() {
          if (window._adRes) { window._adRes(true); window._adRes = null; }
          // Direct bypass to the most likely Poki-Unity object
          try { window.uInst.SendMessage("PokiUnitySDK", "onRewardedBreakComplete"); } catch(e){}
      }
    </script>
  </head>
  <body>

    <div id="pinpoint-ui">
      <button class="mini-btn" onclick="scanAndInject()">💰 SCAN & INJECT CASH</button>
      <button class="mini-btn" onclick="forceSuccess()">🔓 FORCE UNFREEZE</button>
    </div>

    <canvas id="unity-canvas"></canvas>

    <script src="Build/ea153e321edf23b9a40b38d65ce41d01.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/101a0553a2917fd4c62a7e2159d30814.data",
        frameworkUrl: "Build/2809ee090e7f1bf0e1a32425590981e7.framework.js",
        codeUrl: "Build/9d94f3fbc22c5914756c67722e0cdaca.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "master",
        productName: "My Hotel",
        productVersion: "1.0.3",
        // Force the ratio to 1 to fix the zoom/size issues
        devicePixelRatio: 1 
      }).then((instance) => {
          window.uInst = instance;
      });
    </script>
  </body>
</html>
