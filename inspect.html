<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ENI Quarantine Inspector</title>
    <style>
        body { background: #111; color: #00ffaa; font-family: monospace; padding: 20px; font-size: 14px; white-space: pre-wrap; word-wrap: break-word; }
        /* Keep the quarantine cell completely hidden from the main page */
        #sandbox { display: none; width: 0; height: 0; }
    </style>
</head>
<body>
    <div id="output">> Constructing quarantine cell...</div>
    
    <iframe id="sandbox"></iframe>

    <script>
        const out = document.getElementById('output');
        const iframe = document.getElementById('sandbox');
        
        iframe.onload = function() {
            out.innerText += "\n> Target secured in quarantine. Waiting 2 seconds for it to unpack...\n";
            
            setTimeout(() => {
                try {
                    const iWindow = iframe.contentWindow;
                    if (iWindow.PokiSDK) {
                        out.innerText += "\n=== STARTGAMER POKI SDK EXTRACTED ===\n\n";
                        
                        if (iWindow.PokiSDK.rewardedBreak) {
                            out.innerText += "--- REWARDED BREAK ---\n" + iWindow.PokiSDK.rewardedBreak.toString() + "\n\n";
                        }
                        if (iWindow.PokiSDK.commercialBreak) {
                            out.innerText += "--- COMMERCIAL BREAK ---\n" + iWindow.PokiSDK.commercialBreak.toString() + "\n\n";
                        }
                        if (iWindow.PokiSDK.init) {
                            out.innerText += "--- INIT ---\n" + iWindow.PokiSDK.init.toString() + "\n\n";
                        }
                    } else {
                        out.innerText += "\n[!] Error: PokiSDK not found. The script might have self-destructed the iframe window.";
                    }
                } catch(e) {
                    out.innerText += "\n[!] Extraction Failed: " + e.message;
                }
            }, 2000); // Give it plenty of time to decrypt itself
        };

        // Write the dummy environment and their script directly into the isolated iframe
        const iDoc = iframe.contentDocument || iframe.contentWindow.document;
        iDoc.open();
        iDoc.write(`
            <html><head>
            <script>
                // Spoof the environment purely inside the iframe
                try { Object.defineProperty(document, 'referrer', { get: () => "https://startgamer.ru/" }); } catch(e){}
                try { window.isTop = false; Object.defineProperty(window, 'top', { get: () => window }); } catch(e){}
            <\/script>
            </head><body>
            <div id="pokiSdkContainer">
                <div id="pokiSdkOverlay"></div><div id="pokiSdkVideoContainer"></div><div id="pokiSdkSpinnerContainer"></div>
                <div id="adContainer"></div><div id="progressContainer"><div id="progressBar"></div></div><button id="pokiSdkStartAdButton"></button>
            </div>
            <script src="https://jgill001.github.io/hotel2/my-perfect-hotel.js"><\/script>
            </body></html>
        `);
        iDoc.close();
    </script>
</body>
</html>
